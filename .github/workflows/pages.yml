# Deploy to GitHub Pages.
#
# In the repo, Settings -> Pages -> Source: pick "GitHub Actions". After that
# every push to main publishes automatically.
#
# Two things to note:
#
# 1. The ETL does not run in CI. api.statbank.dk is reachable from GitHub
#    runners, but the data updates quarterly and there is no need to pull
#    20 MB on every push. public/data and public/geo are build products
#    committed to the repo (about 8 MB together). When the data updates, run
#    npm run etl locally and commit the products under public/ with it.
#
# 2. DuckDB's wasm (77 MB) is **not committed**; postinstall copies it from
#    node_modules. Committing it would blow up the repo size, and every
#    npm install regenerates it deterministically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall syncs duckdb's wasm/worker into public/duckdb
      - run: npm ci

      - run: npm run typecheck

      # Project sites are served under /<repo>/, so basePath is required.
      # For a user site (<user>.github.io) or a custom domain, change both
      # values to an empty string.
      - name: Build static export
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      # Pages runs Jekyll by default, which swallows directories starting
      # with an underscore (_next first of all)
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
